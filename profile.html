<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avine — Profile</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="account.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main class="account-page">
    <div class="account-shell">
      <a class="account-brand" href="home.html">Avine</a>
      <section class="account-card">
        <h1>Your profile</h1>
        <p class="account-intro">Your role and semester assignment are controlled by an administrator.</p>
        <p class="profile-meta" id="membership-summary">Loading membership…</p>
        <div class="account-message" id="profile-message" role="status" aria-live="polite"></div>

        <form class="account-form" id="profile-form">
          <div class="account-grid">
            <div class="form-group">
              <label for="first-name">First name</label>
              <input id="first-name" autocomplete="given-name" required>
            </div>
            <div class="form-group">
              <label for="last-name">Last name</label>
              <input id="last-name" autocomplete="family-name" required>
            </div>
          </div>
          <div class="form-group">
            <label for="profile-email">Emory email</label>
            <input id="profile-email" type="email" disabled>
          </div>
          <div class="form-group">
            <label for="graduation-year">Graduation year</label>
            <input id="graduation-year" type="number" min="2000" max="2100">
          </div>
          <div class="form-group">
            <label for="major">Major</label>
            <input id="major" autocomplete="organization-title">
          </div>
          <div class="form-group">
            <label for="bio">Short bio</label>
            <textarea id="bio" maxlength="500"></textarea>
          </div>
          <div class="profile-actions">
            <button class="account-button" type="submit">Save profile</button>
            <button class="account-button account-secondary" id="sign-out" type="button">Sign out</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script type="module">
    import {
      getMyProfile,
      getMyMemberships,
      updateMyProfile,
      signOut
    } from './js/auth-client.js';

    const form = document.getElementById('profile-form');
    const message = document.getElementById('profile-message');

    function showMessage(text, type = 'error') {
      message.textContent = text;
      message.className = 'account-message visible ' + type;
    }

    try {
      const ROLE_LABELS = { admin: 'Admin', senior: 'Senior', vp: 'Vice President', associate: 'Associate', analyst: 'Analyst', general: 'General' };
      const [profile, memberships] = await Promise.all([
        getMyProfile(),
        getMyMemberships()
      ]);

      if (profile) {
        document.getElementById('first-name').value = profile.first_name || '';
        document.getElementById('last-name').value = profile.last_name || '';
        document.getElementById('profile-email').value = profile.email || '';
        document.getElementById('graduation-year').value = profile.graduation_year || '';
        document.getElementById('major').value = profile.major || '';
        document.getElementById('bio').value = profile.bio || '';
      }

      const summary = memberships.length
        ? memberships.map(item => item.semesters.name + ' · ' + (ROLE_LABELS[item.role] || item.role)).join(' | ')
        : 'No semester role has been assigned.';
      document.getElementById('membership-summary').textContent = summary;
    } catch (error) {
      showMessage(error.message || 'Unable to load your profile.');
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        await updateMyProfile({
          first_name: document.getElementById('first-name').value,
          last_name: document.getElementById('last-name').value,
          graduation_year: document.getElementById('graduation-year').value,
          major: document.getElementById('major').value,
          bio: document.getElementById('bio').value
        });
        showMessage('Profile saved.', 'success');
      } catch (error) {
        showMessage(error.message || 'Unable to save your profile.');
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById('sign-out').addEventListener('click', signOut);
  </script>
</body>
</html>
