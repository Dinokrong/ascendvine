<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avine — Groups</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="account.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="theme.css">
  <style>
    /* Group photo banner */
    .group-banner { display: flex; align-items: center; gap: 1.1rem; margin-bottom: 1rem; padding: 1rem; border-radius: 14px; background: var(--orange-tint); }
    .group-photo { flex: none; display: grid; place-items: center; width: 104px; aspect-ratio: 1; border-radius: 12px; background: #fff center / cover no-repeat; color: var(--orange-deeper, var(--orange-dark)); font-size: 2.4rem; font-weight: 600; }
    .group-banner-text { flex: 1; min-width: 0; }
    .group-banner-text > span { display: block; color: var(--account-muted); font-size: .7rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
    .group-banner-text h2 { margin: .2rem 0 .15rem; font-size: 1.5rem; overflow-wrap: anywhere; }
    .group-banner-text p { margin: 0; color: var(--account-muted); font-size: .88rem; }
    .group-banner-text p strong { color: var(--text); font-weight: 500; }
    .group-photo-actions { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .7rem; }
    .group-photo-actions button { border: 1px solid var(--border); border-radius: 8px; padding: .35rem .7rem; background: #fff; color: var(--text); font: inherit; font-size: .8rem; font-weight: 500; cursor: pointer; }
    .group-photo-actions button.primary { border-color: var(--text); background: var(--text); color: #fff; }
    .group-photo-actions button:disabled { opacity: .6; cursor: wait; }
    @media (max-width: 520px) { .group-photo { width: 76px; font-size: 1.8rem; } .group-banner-text h2 { font-size: 1.25rem; } }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-left"><a href="home.html" class="navbar-logo">Avine</a></div>
    <div class="nav-center">
      <a href="questionbank.html">Question Bank</a>
      <a href="studyguide.html">Study Guide</a>
    </div>
    <div class="nav-right account-nav"><a href="profile.html">Profile</a></div>
  </nav>

  <main class="admin-page">
    <header class="admin-header">
      <div>
        <div class="home-eyebrow">Semester organization</div>
        <h1>Your groups</h1>
        <p>See your Senior-led group and the members you will work with this semester.</p>
      </div>
      <label class="admin-semester-picker">
        Semester
        <select id="semester-select"></select>
      </label>
    </header>

    <div class="account-message" id="group-message" role="status" aria-live="polite"></div>
    <section id="groups-grid" class="group-directory"></section>
    <input type="file" id="group-photo-input" accept="image/*" hidden>
  </main>

  <script type="module">
    import { supabase, requireApprovedUser } from './js/auth-client.js';

    const message = document.getElementById('group-message');
    const semesterSelect = document.getElementById('semester-select');
    const grid = document.getElementById('groups-grid');
    let currentUser;

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Vice Presidents first, then Associates, then Analysts; alphabetical by
    // last name (then first name) within each.
    const ROLE_ORDER = { vp: 0, associate: 1, analyst: 2 };
    function byRoleThenLastName(a, b) {
      const roleGap = (ROLE_ORDER[a.role] ?? 3) - (ROLE_ORDER[b.role] ?? 3);
      if (roleGap) return roleGap;
      const last = (a.profile.last_name || '').localeCompare(b.profile.last_name || '', undefined, { sensitivity: 'base' });
      if (last) return last;
      return (a.profile.first_name || '').localeCompare(b.profile.first_name || '', undefined, { sensitivity: 'base' });
    }

    function nameOf(profile) {
      return ((profile?.first_name || '') + ' ' + (profile?.last_name || '')).trim()
        || profile?.email || 'Unknown member';
    }

    function showError(text) {
      message.textContent = text;
      message.className = 'account-message visible error';
    }

    async function loadSemesters() {
      currentUser = await requireApprovedUser();
      const { data, error } = await supabase
        .from('semester_memberships')
        .select('semester_id, role, semesters(name, is_active)')
        .eq('user_id', currentUser.id);

      if (error) throw error;
      if (!data?.length) throw new Error('You are not assigned to a semester yet.');

      semesterSelect.innerHTML = data.map(item =>
        '<option value="' + item.semester_id + '">' + esc(item.semesters.name) + '</option>'
      ).join('');
    }

    async function refresh() {
      const semesterId = semesterSelect.value;
      const [groupResult, memberResult, roleResult] = await Promise.all([
        supabase.from('groups')
          .select('id, name, senior_id, photo_path')
          .eq('semester_id', semesterId)
          .order('name'),
        supabase.from('group_memberships')
          .select('group_id, user_id')
          .eq('semester_id', semesterId),
        supabase.from('semester_memberships')
          .select('user_id, role')
          .eq('semester_id', semesterId)
      ]);

      for (const result of [groupResult, memberResult, roleResult]) {
        if (result.error) throw result.error;
      }

      const groups = groupResult.data || [];
      const viewerIsAdmin = (roleResult.data || []).some(item => item.user_id === currentUser.id && item.role === 'admin');
      const groupMemberships = memberResult.data || [];
      const roles = roleResult.data || [];
      const ids = [...new Set([
        ...groups.map(group => group.senior_id),
        ...groupMemberships.map(member => member.user_id)
      ])];

      let profiles = [];
      if (ids.length) {
        const profileResult = await supabase
          .from('profiles')
          .select('id, email, first_name, last_name, graduation_year')
          .in('id', ids);
        if (profileResult.error) throw profileResult.error;
        profiles = profileResult.data || [];
      }

      if (!groups.length) {
        grid.innerHTML = '<div class="group-empty-state"><h2>No group assigned yet</h2><p>An Admin will place you into a Senior-led group.</p></div>';
        return;
      }

      grid.innerHTML = groups.map(group => {
        const senior = profiles.find(profile => profile.id === group.senior_id);
        const members = groupMemberships
          .filter(member => member.group_id === group.id)
          .map(member => ({
            profile: profiles.find(profile => profile.id === member.user_id),
            role: roles.find(role => role.user_id === member.user_id)?.role
          }))
          .filter(item => item.profile)
          .sort(byRoleThenLastName);

        const canEditPhoto = viewerIsAdmin || group.senior_id === currentUser.id;
        const photo = group.photo_path ? supabase.storage.from('group-photos').getPublicUrl(group.photo_path).data.publicUrl : '';
        const photoActions = !canEditPhoto ? '' : '<div class="group-photo-actions">' +
          (photo
            ? '<button type="button" data-upload-photo="' + group.id + '">Change photo</button>' +
              '<button type="button" data-remove-photo="' + group.id + '">Remove</button>'
            : '<button type="button" class="primary" data-upload-photo="' + group.id + '">Add a group photo</button>') +
          '</div>';
        return '<article class="group-directory-card">' +
          '<div class="group-banner">' +
            '<div class="group-photo"' + (photo ? ' style="background-image:url(\'' + esc(photo) + '\')" role="img" aria-label="' + esc(group.name) + ' group photo">'
              : ' aria-hidden="true">' + esc(group.name.replace(/^Group\s+/i, '').charAt(0).toUpperCase())) + '</div>' +
            '<div class="group-banner-text"><span>Senior-led group</span><h2>' + esc(group.name) + '</h2>' +
              '<p>Senior <strong>' + esc(nameOf(senior)) + '</strong></p>' + photoActions + '</div>' +
          '</div>' +
          '<div class="group-member-list">' +
            (members.length ? members.map(item =>
              '<div class="group-person' + (item.profile.id === currentUser.id ? ' current-user' : '') + '">' +
                '<div><strong>' + esc(nameOf(item.profile)) + '</strong><span>' + esc(item.profile.email) + '</span></div>' +
                '<span class="role-pill">' + esc({ admin: 'Admin', senior: 'Senior', vp: 'Vice President', associate: 'Associate', analyst: 'Analyst', general: 'General' }[item.role] || 'Member') + '</span>' +
              '</div>'
            ).join('') : '<p class="admin-empty">No members assigned yet.</p>') +
          '</div>' +
        '</article>';
      }).join('');
    }

    // ---------- Group photo upload (group's Senior or an Admin) ----------
    let photoGroup = null;

    function showSuccess(text) {
      message.textContent = text;
      message.className = 'account-message visible success';
    }

    // Crop photos to a centered square and shrink them before uploading.
    function resizeImage(file, maxSize = 600) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onerror = () => reject(new Error('That file could not be read as an image.'));
        img.onload = () => {
          const side = Math.min(img.width, img.height);
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = Math.min(maxSize, side);
          canvas.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side,
            0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(img.src);
          canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Unable to process that image.')), 'image/jpeg', 0.85);
        };
        img.src = URL.createObjectURL(file);
      });
    }

    grid.addEventListener('click', async event => {
      const upload = event.target.closest('[data-upload-photo]');
      if (upload) {
        photoGroup = upload.dataset.uploadPhoto;
        document.getElementById('group-photo-input').click();
        return;
      }
      const remove = event.target.closest('[data-remove-photo]');
      if (!remove || !window.confirm('Remove this group photo?')) return;
      try {
        remove.disabled = true;
        const result = await supabase.rpc('set_group_photo', { target_group: remove.dataset.removePhoto, photo_path: null });
        if (result.error) throw result.error;
        showSuccess('Group photo removed.');
        await refresh();
      } catch (error) {
        showError(error.message || 'Unable to remove the photo.');
        remove.disabled = false;
      }
    });

    document.getElementById('group-photo-input').addEventListener('change', async event => {
      const file = event.target.files[0];
      event.target.value = '';
      if (!file || !photoGroup) return;
      grid.querySelectorAll('[data-upload-photo]').forEach(button => { button.disabled = true; button.textContent = 'Uploading…'; });
      try {
        if (!file.type.startsWith('image/')) throw new Error('Please choose an image file.');
        const blob = await resizeImage(file);
        const path = photoGroup + '/' + Date.now() + '.jpg';
        const upload = await supabase.storage.from('group-photos').upload(path, blob, { contentType: 'image/jpeg' });
        if (upload.error) throw upload.error;
        const result = await supabase.rpc('set_group_photo', { target_group: photoGroup, photo_path: path });
        if (result.error) throw result.error;
        showSuccess('Group photo updated.');
      } catch (error) {
        showError(error.message || 'Unable to upload the photo.');
      }
      await refresh();
    });

    semesterSelect.addEventListener('change', () => refresh().catch(error => showError(error.message)));

    try {
      await loadSemesters();
      await refresh();
    } catch (error) {
      showError(error.message || 'Unable to load groups.');
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
