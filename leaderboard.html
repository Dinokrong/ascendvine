<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AscendVine — Leaderboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="account.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <nav class="navbar">
    <div class="nav-left"><a href="home.html" class="navbar-logo">AscendVine</a></div>
    <div class="nav-center">
      <a href="questionbank.html">Question Bank</a>
      <a href="studyguide.html">Study Guide</a>
    </div>
    <div class="nav-right account-nav"><a href="profile.html">Profile</a></div>
  </nav>

  <main class="quiz-topic-page">
    <header class="quiz-topic-header">
      <div>
        <div class="home-eyebrow">Semester standings</div>
        <h1>Leaderboard</h1>
        <p id="board-description"></p>
      </div>
      <label class="admin-semester-picker">Semester<select id="semester-select"></select></label>
    </header>

    <div class="leaderboard-tabs" role="tablist" aria-label="Leaderboard">
      <button type="button" role="tab" data-board="quiz">Quiz Scores</button>
      <button type="button" role="tab" data-board="practice">Study Time</button>
    </div>

    <div class="account-message" id="leaderboard-message" role="status" aria-live="polite"></div>
    <section class="leaderboard-card">
      <div class="leaderboard-heading" id="leaderboard-heading"></div>
      <div id="leaderboard-rows"></div>
    </section>
  </main>

  <script type="module">
    import { supabase, requireApprovedUser } from './js/auth-client.js';

    const semesterSelect = document.getElementById('semester-select');
    const message = document.getElementById('leaderboard-message');
    const description = document.getElementById('board-description');
    const heading = document.getElementById('leaderboard-heading');
    const rows = document.getElementById('leaderboard-rows');
    const tabs = document.querySelectorAll('.leaderboard-tabs [data-board]');

    const BOARDS = {
      quiz: {
        description: 'Cumulative points from graded weekly quizzes.',
        columns: ['Rank', 'Member', 'Quizzes', 'Points', 'Average'],
        rpc: 'get_quiz_leaderboard',
        cells: member => [
          esc(member.quizzes_graded),
          esc(member.points_earned) + ' / ' + esc(member.points_possible),
          '<strong>' + esc(member.percentage) + '%</strong>'
        ]
      },
      practice: {
        description: 'Active time in the Question Bank. Time counts only while the page is open and in use.',
        columns: ['Rank', 'Member', 'Days active', 'Active time', 'Per active day'],
        rpc: 'get_practice_leaderboard',
        cells: member => [
          esc(member.days_active),
          '<strong>' + esc(formatDuration(member.active_seconds)) + '</strong>',
          esc(Number(member.days_active) ? formatDuration(member.active_seconds / member.days_active) : '—')
        ]
      }
    };

    let requestId = 0;
    let board = new URLSearchParams(window.location.search).get('board') === 'practice' ? 'practice' : 'quiz';

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function roleLabel(role) {
      return role ? role.charAt(0).toUpperCase() + role.slice(1) : '';
    }

    function formatDuration(seconds) {
      const minutes = Math.floor(Number(seconds || 0) / 60);
      const hours = Math.floor(minutes / 60);
      if (!hours) return minutes + 'm';
      return hours + 'h ' + String(minutes % 60).padStart(2, '0') + 'm';
    }

    function showError(text) {
      message.textContent = text;
      message.className = 'account-message visible error';
    }

    async function loadSemesters() {
      const user = await requireApprovedUser();
      const result = await supabase.from('semester_memberships')
        .select('semester_id, semesters(name)')
        .eq('user_id', user.id);
      if (result.error) throw result.error;
      if (!result.data?.length) throw new Error('You are not assigned to a semester yet.');
      semesterSelect.innerHTML = result.data.map(item =>
        '<option value="' + item.semester_id + '">' + esc(item.semesters.name) + '</option>'
      ).join('');
    }

    async function refresh() {
      const config = BOARDS[board];
      description.textContent = config.description;
      heading.innerHTML = config.columns.map(column => '<span>' + esc(column) + '</span>').join('');
      tabs.forEach(tab => tab.setAttribute('aria-selected', String(tab.dataset.board === board)));

      const thisRequest = ++requestId;
      rows.innerHTML = '';
      const result = await supabase.rpc(config.rpc, { target_semester: semesterSelect.value });
      if (thisRequest !== requestId) return; // a newer tab or semester was chosen
      if (result.error) throw result.error;
      const standings = result.data || [];

      if (!standings.length) {
        rows.innerHTML = '<div class="leaderboard-empty">No Associates or Analysts are assigned yet.</div>';
        return;
      }

      rows.innerHTML = standings.map(member =>
        '<div class="leaderboard-row' + (Number(member.rank) <= 3 ? ' top-three' : '') + '">' +
          '<strong class="leaderboard-rank">' + esc(member.rank) + '</strong>' +
          '<div class="leaderboard-person"><strong>' + esc(member.display_name) + '</strong>' +
          '<span>' + esc(roleLabel(member.role)) + (member.group_name ? ' · ' + esc(member.group_name) : ' · No group yet') + '</span></div>' +
          config.cells(member).map(cell => '<span>' + cell + '</span>').join('') +
        '</div>'
      ).join('');
    }

    tabs.forEach(tab => tab.addEventListener('click', () => {
      board = tab.dataset.board;
      history.replaceState(null, '', '?board=' + board);
      refresh().catch(error => showError(error.message));
    }));

    semesterSelect.addEventListener('change', () => refresh().catch(error => showError(error.message)));

    try {
      await loadSemesters();
      await refresh();
    } catch (error) {
      showError(error.message || 'Unable to load standings.');
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
