<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avine — Account</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="account.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main class="account-page">
    <div class="account-shell">
      <a class="account-brand" href="index.html">Avine</a>

      <section class="account-card">
        <h1 id="account-heading">Welcome back</h1>
        <p class="account-intro" id="account-intro">Sign in with your verified Emory email.</p>

        <div class="account-tabs" role="tablist" aria-label="Account options">
          <button class="account-tab active" id="signin-tab" type="button" role="tab" aria-selected="true">Sign in</button>
          <button class="account-tab" id="signup-tab" type="button" role="tab" aria-selected="false">Create account</button>
        </div>

        <div class="account-message" id="account-message" role="status" aria-live="polite"></div>

        <form class="account-form" id="signin-form">
          <div class="form-group">
            <label for="signin-email">Emory email</label>
            <input id="signin-email" name="email" type="email" autocomplete="email" placeholder="name@emory.edu" required>
          </div>
          <div class="form-group">
            <label for="signin-password">Password</label>
            <input id="signin-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="account-button" type="submit">Sign in</button>
          <p class="account-help">
            <button class="account-link-button" id="forgot-password" type="button">Forgot your password?</button>
          </p>
        </form>

        <form class="account-form" id="signup-form" hidden>
          <div class="account-grid">
            <div class="form-group">
              <label for="signup-first-name">First name</label>
              <input id="signup-first-name" name="firstName" autocomplete="given-name" required>
            </div>
            <div class="form-group">
              <label for="signup-last-name">Last name</label>
              <input id="signup-last-name" name="lastName" autocomplete="family-name" required>
            </div>
          </div>
          <div class="form-group">
            <label for="signup-email">Emory email</label>
            <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="name@emory.edu" required>
          </div>
          <div class="form-group">
            <label for="signup-year">Graduation year</label>
            <input id="signup-year" name="graduationYear" type="number" min="2000" max="2100" inputmode="numeric" required>
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input id="signup-password" name="password" type="password" minlength="10" autocomplete="new-password" required>
          </div>
          <button class="account-button" type="submit">Create account</button>
          <p class="account-help">Account access requires email verification. Access and roles are assigned by an administrator.</p>
        </form>
      </section>
    </div>
  </main>

  <script type="module">
    import {
      isSupabaseConfigured,
      supabase,
      signIn,
      signUp,
      sendPasswordReset,
      getVerifiedUser
    } from './js/auth-client.js';

    const message = document.getElementById('account-message');
    const signInForm = document.getElementById('signin-form');
    const signUpForm = document.getElementById('signup-form');
    const signInTab = document.getElementById('signin-tab');
    const signUpTab = document.getElementById('signup-tab');

    function showMessage(text, type = 'error') {
      message.textContent = text;
      message.className = 'account-message visible ' + type;
    }

    function setMode(mode) {
      const isSignUp = mode === 'signup';
      signInForm.hidden = isSignUp;
      signUpForm.hidden = !isSignUp;
      signInTab.classList.toggle('active', !isSignUp);
      signUpTab.classList.toggle('active', isSignUp);
      signInTab.setAttribute('aria-selected', String(!isSignUp));
      signUpTab.setAttribute('aria-selected', String(isSignUp));
      document.getElementById('account-heading').textContent = isSignUp ? 'Create your account' : 'Welcome back';
      document.getElementById('account-intro').textContent = isSignUp
        ? 'Use your @emory.edu address to join Avine.'
        : 'Sign in with your verified Emory email.';
      message.className = 'account-message';
    }

    async function withBusy(form, action) {
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        await action();
      } catch (error) {
        showMessage(error.message || 'Something went wrong. Please try again.');
      } finally {
        button.disabled = false;
      }
    }

    signInTab.addEventListener('click', () => setMode('signin'));
    signUpTab.addEventListener('click', () => setMode('signup'));

    signInForm.addEventListener('submit', event => {
      event.preventDefault();
      withBusy(signInForm, async () => {
        await signIn(
          document.getElementById('signin-email').value,
          document.getElementById('signin-password').value
        );
        window.location.replace('home.html');
      });
    });

    signUpForm.addEventListener('submit', event => {
      event.preventDefault();
      withBusy(signUpForm, async () => {
        await signUp({
          email: document.getElementById('signup-email').value,
          password: document.getElementById('signup-password').value,
          firstName: document.getElementById('signup-first-name').value,
          lastName: document.getElementById('signup-last-name').value,
          graduationYear: document.getElementById('signup-year').value
        });
        signUpForm.reset();
        showMessage('Check your Emory inbox to verify your email. After verification, an administrator must approve your account.', 'success');
      });
    });

    document.getElementById('forgot-password').addEventListener('click', async () => {
      const email = document.getElementById('signin-email').value;
      try {
        await sendPasswordReset(email);
        showMessage('If an eligible account exists, a password-reset email has been sent.', 'success');
      } catch (error) {
        showMessage(error.message || 'Unable to send the password-reset email.');
      }
    });

    const query = new URLSearchParams(location.search);
    if (!isSupabaseConfigured || query.has('setup')) {
      showMessage('Account infrastructure is ready, but the Supabase project has not been connected yet.');
    } else if (query.get('approval') === 'pending') {
      showMessage('Your email is verified, but an administrator must approve your account before you can enter.', 'success');
    } else {
      getVerifiedUser().then(user => {
        if (user) window.location.replace('home.html');
      });
    }
  </script>
</body>
</html>
