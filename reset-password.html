<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AscendVine — Reset password</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="account.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <main class="account-page">
    <div class="account-shell">
      <a class="account-brand" href="index.html">AscendVine</a>
      <section class="account-card">
        <h1>Choose a new password</h1>
        <p class="account-intro">Use at least 10 characters.</p>
        <div class="account-message" id="reset-message" role="status" aria-live="polite"></div>
        <form class="account-form" id="reset-form">
          <div class="form-group">
            <label for="new-password">New password</label>
            <input id="new-password" type="password" minlength="10" autocomplete="new-password" required>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" type="password" minlength="10" autocomplete="new-password" required>
          </div>
          <button class="account-button" type="submit">Update password</button>
        </form>
      </section>
    </div>
  </main>

  <script type="module">
    import { supabase, isSupabaseConfigured } from './js/auth-client.js';

    const form = document.getElementById('reset-form');
    const message = document.getElementById('reset-message');

    function showMessage(text, type = 'error') {
      message.textContent = text;
      message.className = 'account-message visible ' + type;
    }

    if (!isSupabaseConfigured) {
      showMessage('Account infrastructure has not been connected yet.');
      form.hidden = true;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const password = document.getElementById('new-password').value;
      const confirmation = document.getElementById('confirm-password').value;

      if (password !== confirmation) {
        showMessage('The passwords do not match.');
        return;
      }

      const button = form.querySelector('button');
      button.disabled = true;
      const { error } = await supabase.auth.updateUser({ password });
      button.disabled = false;

      if (error) {
        showMessage(error.message);
        return;
      }

      showMessage('Password updated. Redirecting to sign in…', 'success');
      await supabase.auth.signOut();
      setTimeout(() => window.location.replace('index.html'), 1200);
    });
  </script>
</body>
</html>
