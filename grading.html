<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AscendVine — Quiz grading</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="account.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <nav class="navbar">
    <div class="nav-left"><a href="home.html" class="navbar-logo">Avine</a></div>
    <div class="nav-center">
      <a href="questionbank.html">Question Bank</a>
      <a href="studyguide.html">Study Guide</a>
    </div>
    <div class="nav-right account-nav"><a href="profile.html">Profile</a></div>
  </nav>

  <main class="admin-page">
    <header class="admin-header">
      <div>
        <div class="home-eyebrow">Senior and Vice President workspace</div>
        <h1>Quiz grading</h1>
        <p>Seniors and Vice Presidents grade submissions for their own group. Admins retain semester-wide oversight.</p>
      </div>
      <label class="admin-semester-picker">
        Semester
        <select id="semester-select"></select>
      </label>
    </header>

    <div class="account-message" id="grading-message" role="status" aria-live="polite"></div>
    <section id="grading-grid" class="group-directory"></section>
  </main>

  <script type="module">
    import { supabase, requireApprovedUser } from './js/auth-client.js';

    const ALLOWED_ROLES = ['admin', 'senior', 'vp'];
    const message = document.getElementById('grading-message');
    const semesterSelect = document.getElementById('semester-select');
    const grid = document.getElementById('grading-grid');
    let memberships = [];
    let currentUser;

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showError(text) {
      message.textContent = text;
      message.className = 'account-message visible error';
    }

    function nameOf(profile) {
      return ((profile?.first_name || '') + ' ' + (profile?.last_name || '')).trim()
        || profile?.email || 'AscendVine member';
    }

    function formatDate(value) {
      if (!value) return '';
      return new Intl.DateTimeFormat(undefined, {
        month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
      }).format(new Date(value));
    }

    async function loadSemesters() {
      currentUser = await requireApprovedUser();
      const { data, error } = await supabase
        .from('semester_memberships')
        .select('semester_id, role, semesters(name, is_active)')
        .eq('user_id', currentUser.id);

      if (error) throw error;
      memberships = (data || []).filter(item => ALLOWED_ROLES.includes(item.role));
      if (!memberships.length) throw new Error('Quiz grading is available only to Admins, Seniors, and Vice Presidents.');

      semesterSelect.innerHTML = memberships.map(item =>
        '<option value="' + item.semester_id + '">' + esc(item.semesters.name) + '</option>'
      ).join('');
    }

    async function refresh() {
      const semesterId = semesterSelect.value;
      const currentRole = memberships.find(item => item.semester_id === semesterId)?.role;
      const [groupResult, groupMemberResult, attemptResult] = await Promise.all([
        supabase.from('groups')
          .select('id, name, senior_id')
          .eq('semester_id', semesterId)
          .order('name'),
        supabase.from('group_memberships')
          .select('group_id, user_id')
          .eq('semester_id', semesterId),
        supabase.from('quiz_attempts')
          .select('id, quiz_id, group_id, user_id, status, submitted_at, graded_at, score')
          .in('status', ['submitted', 'graded'])
      ]);

      if (groupResult.error) throw groupResult.error;
      if (groupMemberResult.error) throw groupMemberResult.error;
      if (attemptResult.error) throw attemptResult.error;

      const groups = groupResult.data || [];
      const groupMembers = groupMemberResult.data || [];
      const attempts = attemptResult.data || [];

      if (!groups.length) {
        grid.innerHTML = '<div class="group-empty-state"><h2>No grading groups yet</h2><p>An Admin must create and assign groups before quizzes can be graded.</p></div>';
        return;
      }

      const userIds = [...new Set(attempts.map(attempt => attempt.user_id))];
      const quizIds = [...new Set(attempts.map(attempt => attempt.quiz_id))];
      const [profileResult, quizResult] = await Promise.all([
        userIds.length
          ? supabase.from('profiles').select('id, email, first_name, last_name').in('id', userIds)
          : Promise.resolve({ data: [], error: null }),
        quizIds.length
          ? supabase.from('quizzes').select('id, title, semester_id').eq('semester_id', semesterId).in('id', quizIds)
          : Promise.resolve({ data: [], error: null })
      ]);
      if (profileResult.error) throw profileResult.error;
      if (quizResult.error) throw quizResult.error;
      const profiles = profileResult.data || [];
      const quizzes = quizResult.data || [];

      // How many times each member left the quiz page mid-quiz. If this
      // feature isn't installed in the database yet, show no badges.
      const awayResult = attempts.length
        ? await supabase.from('quiz_away_events').select('attempt_id').in('attempt_id', attempts.map(attempt => attempt.id))
        : { data: [], error: null };
      const awayCounts = {};
      (awayResult.error ? [] : awayResult.data || []).forEach(event => {
        awayCounts[event.attempt_id] = (awayCounts[event.attempt_id] || 0) + 1;
      });

      grid.innerHTML = groups.map(group => {
        const count = groupMembers.filter(member => member.group_id === group.id).length;
        const submissions = attempts
          .filter(attempt => attempt.group_id === group.id && quizzes.some(quiz => quiz.id === attempt.quiz_id))
          .sort((a, b) => new Date(b.submitted_at || 0) - new Date(a.submitted_at || 0));
        return '<article class="grading-card">' +
          '<div><span class="role-pill">' + esc({ admin: 'Admin', senior: 'Senior', vp: 'Vice President', associate: 'Associate', analyst: 'Analyst', general: 'General' }[currentRole] || currentRole) + ' access</span>' +
          '<h2>' + esc(group.name) + '</h2>' +
          '<p>' + count + ' assigned member' + (count === 1 ? '' : 's') + '</p></div>' +
          (submissions.length ? '<div class="grading-submission-list">' + submissions.map(attempt => {
            const profile = profiles.find(item => item.id === attempt.user_id);
            const quiz = quizzes.find(item => item.id === attempt.quiz_id);
            return '<a class="grading-submission" href="grade-quiz.html?id=' + attempt.id + '">' +
              '<div><strong>' + esc(nameOf(profile)) +
              (awayCounts[attempt.id]
                ? '<span class="grading-away-badge">Left page ' + awayCounts[attempt.id] + '×</span>'
                : '') +
              '</strong><span>' + esc(quiz?.title || 'Weekly quiz') +
              ' · ' + esc(formatDate(attempt.submitted_at)) + '</span></div>' +
              '<span class="grading-submission-status ' + attempt.status + '">' +
              (attempt.status === 'graded' ? esc(attempt.score ?? 'Graded') : 'Grade') + '</span></a>';
          }).join('') + '</div>' : '<div class="grading-empty"><strong>No submissions waiting</strong>' +
            '<span>Submitted quizzes from this group will appear here.</span></div>') +
        '</article>';
      }).join('');
    }

    semesterSelect.addEventListener('change', () => refresh().catch(error => showError(error.message)));

    try {
      await loadSemesters();
      await refresh();
    } catch (error) {
      showError(error.message || 'Unable to load the grading workspace.');
      grid.hidden = true;
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
